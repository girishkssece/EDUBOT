name: EduBot CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit langchain langchain-community langchain-groq langchain-text-splitters langchain-core pymupdf faiss-cpu python-dotenv pillow plotly huggingface_hub groq

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile chatbot.py
          python -m py_compile embeddings.py
          python -m py_compile auth.py
          python -m py_compile pdf_processor.py
          python -m py_compile progress_tracker.py
          python -m py_compile hf_storage.py
          echo "✅ All syntax checks passed!"

      - name: Check imports
        run: |
          python -c "import streamlit; print('✅ Streamlit OK')"
          python -c "import langchain; print('✅ LangChain OK')"
          python -c "import faiss; print('✅ FAISS OK')"
          python -c "import fitz; print('✅ PyMuPDF OK')"
          python -c "import plotly; print('✅ Plotly OK')"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          echo "✅ Deployment triggered on Render!"
